# zmm 内容系统 · 配置模板
#
# 复制成 config.yaml 后填自己的值。技能只读 config.yaml，本体不含任何实例值。
# 读不到 config.yaml 时技能会降级并说明缺什么 —— 不会拿默认值假装是你的设定。
#
# 填写顺序建议：ip → redlines → voice → platforms。前两块不填，红线检查形同虚设。

# ─────────────────────────────────────────────────────────────
# 1. 你是谁（决定所有内容的人称、立场、可信度来源）
# ─────────────────────────────────────────────────────────────
ip:
  name: "你的 IP 名"              # 出现在 CTA、自我介绍里
  # 一句话定位：讲给谁听、讲什么。技能用它判断一个选题在不在你的射程内。
  positioning: "给<目标人群>讲<主题>"
  audience:
    primary: "主要受众，具体到身份"   # 例：有自己生意的小老板
    secondary: "次要受众"           # 例：想做副业的上班族
  # 你的可信度从哪来。没有这一项，所有「凭什么信你」的判断都无从谈起。
  credibility:
    - "你真做过、且能拿出证据的事"

# ─────────────────────────────────────────────────────────────
# 2. 硬红线（每条产出都要过。这块是本系统的核心价值）
# ─────────────────────────────────────────────────────────────
redlines:

  # 卖真不卖梦：允许说什么、绝不说什么
  sell_real:
    enabled: true
    # 可以用的说法（canonical 口径）—— 真实、可验证、不越界
    allowed_phrasings:
      - "用比值/倍数代替绝对金额的说法"
    # 绝对不说的
    forbidden:
      - "公域出现具体收入金额"
      - "承诺收益 / 承诺就业"
      - "把营收说成收入"
    # 遇到金额时的标准解法
    fallback: "换成倍数口径（投一块回六块），保住可信度不露绝对值"

  # 不点名：这些对象只借信号和结构，成稿绝不出现名字
  no_naming:
    enabled: true
    targets: []      # 填你的对标账号名。留空则该检查跳过并在报告里说明
    note: "可以提官方品牌（模型厂商、平台方），不点具体创作者"

  # 平台违禁词。分级：hard 命中即不可发，soft 给替换建议
  banned_words:
    hard: ["最", "第一", "唯一", "全网"]
    soft: []
    # 字系禁令：整类字规避（如合规敏感字）
    forbidden_families:
      - name: "示例字系"
        chars: []
        reason: "为什么禁"
        replacements: {}    # {"原词": "替换词"}

  # 行业黑话禁令：某类词会让目标受众自我排除
  jargon_ban:
    enabled: false
    scope: "钩子 / 标题 / 前 30 秒"
    words: []
    principle: "说结果不说手段"
    exceptions:
      - "照念型：整句 prompt、工具名，观众只复制不需要理解"
      - "以该人群为靶子的泛人群题"

  # 合规口径：某些话题在国内公域有特定说法要求
  compliance:
    enabled: false
    rules: []

# ─────────────────────────────────────────────────────────────
# 3. 文风（写作时守，改稿时清）
# ─────────────────────────────────────────────────────────────
voice:
  name: "你的文风代号"
  do:
    - "短句"
    - "第一人称"
  dont:
    - "破折号"
    - "英文冒号式标题"
    - "「首先 / 其次 / 总而言之」"
    - "连续三句排比"
  emphasis_mark: "「」"        # 强调用什么符号
  emoji: false                 # 全局是否允许；可被 platforms 覆盖

# ─────────────────────────────────────────────────────────────
# 4. 平台（红线不是一套。X 上放宽的在国内公域要重新生效）
# ─────────────────────────────────────────────────────────────
platforms:
  - id: douyin
    name: "抖音"
    domestic_public: true        # true = 国内公域，全套红线生效
    title_limit: 20
    cover_text_limit: 6
    format: "口播视频"
  - id: xiaohongshu
    name: "小红书"
    domestic_public: true
    title_limit: 20
    emoji: true                  # 覆盖 voice.emoji
  - id: wechat_oa
    name: "公众号"
    domestic_public: true
    title_limit: 20
    body_limit: 1000
  - id: x
    name: "X"
    domestic_public: false       # 违禁词表 / 合规口径 / 黑话禁令都不适用
    emoji: true
    note: "受众与国内公域不重合，数据信号要打折扣"

# ─────────────────────────────────────────────────────────────
# 5. 数据与落盘（全部相对于 vault_root；不设则技能降级为无 vault 模式）
# ─────────────────────────────────────────────────────────────
paths:
  vault_root: ""                 # 留空 = 无 vault 模式，技能只做通用判断
  drafts: "_草稿"
  published: "_已发布"
  topic_pipeline: "06-选题装配/选题管道.md"
  test_pipeline: "06-选题装配/X测试管道.md"
  memory: "08-技能记忆"
  tracking: "09-在途"        # zmm-track 的存放位置(承诺/到期/监测/在途/队列)
  empirical: "zmm/references/实证规律库.md"
  scoring_anchors: "zmm-review/references/评分锚点.md"

# ─────────────────────────────────────────────────────────────
# 6. 评分（达标线可调，但改之前先看它有没有被验证过）
# ─────────────────────────────────────────────────────────────
scoring:
  hard_gate:
    min_80plus: 4                # 硬闸门。80+ 计数跨评审员收敛，可作判据
  reference_only:
    min_60plus: 8                # 参考项。60+ 计数不收敛，不作 A/B 判据
  # 每档的真实例句放在 paths.scoring_anchors 指向的文件里。
  # 没填自己的锚点前，评分只给参考区间，不给硬判定。
  anchors_filled: false

# ─────────────────────────────────────────────────────────────
# 7. 生意（商业运营集用。只做内容不填这块）
# ─────────────────────────────────────────────────────────────
business:
  # ── 脱敏（要把分析结果发出去 / 开源时必开）──────────────────
  # 技能对外产出一律用代号和比值，绝不出真名和绝对金额。
  # 映射只存在本文件里，而本文件不进公开仓库。
  privacy:
    mode: "pseudonym"           # off = 直接用真名（纯自用）｜pseudonym = 对外用代号
    # 代号建议带「业务形态 + 规模档」，保留分析所需的形状，不泄露身份
    aliases: []
      # - real: "真实产品名"
      #   alias: "按量API·大"
    # 对外产物的硬约束
    output_rules:
      - "只出比例（营收贡献% / 时间占比% / 错配比），不出绝对金额"
      - "不出客户名、域名、仓库名、账号 ID"
      - "规模用档位（大/中/小）不用具体数值"

  # 每周实际投入到生意上的总工时。组合体检的分母，填实数别填理想值。
  weekly_hours_total: null

  # 产品线。每条至少要有 revenue_monthly 和 weekly_hours，否则进不了组合分析。
  lines:
    - id: ""
      name: ""
      revenue_monthly: null       # 上个完整月，数量级即可
      weekly_hours: null          # 你每周花在它上面的小时
      maintain_hours: null        # 什么都不做、只保证不出事的最低工时
      billing: ""                 # subscription | usage | one-off | mixed
      # 上次明显多投入时涨了多少。没有历史就留空，判断会降级为推断。
      last_investment_delta: ""

  # 预先承诺：冷静时写下的砍/收缩触发条件。到期执行，不重新讨论。
  commitments: []
    # - line: ""
    #   deadline: "YYYY-MM-DD"
    #   condition: "可验证的数字条件"
    #   action: "到期做什么"

  # 数据源。技能只读，且只声明「去哪取」，不含任何密钥。
  data_sources:
    revenue: ""                   # 怎么取营收（工具名 / 报表路径）
    usage: ""                     # 按量计费产品的用量数据
    note: "凭据走环境变量或各工具自己的配置，绝不写进本文件"

# ─────────────────────────────────────────────────────────────
# 8. 指标口径（不同账号基线不同，别用别人的线卡自己）
# ─────────────────────────────────────────────────────────────
metrics:
  save_rate_good: null           # 收藏率达到多少算高质量信号。null = 用你自己的中位数动态算
  viral_multiplier: 3            # 曝光达到自己中位数的几倍算爆
  viral_floor: null              # 且不低于这个绝对值
  note: "所有基线优先用自己的历史中位数。抄别人的阈值是本系统明确反对的做法。"
